<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracking</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin:0;
            font-family: Arial, Helvetica, sans-serif;
        }
        .main-container{
            background-color: green;
            width: clamp(500px, 50vw, 800px);
            height: 80vh;
            margin:auto;
            padding: 2rem;

            .view-container{
                background: linear-gradient(90deg, rgba(81, 255, 1, 0.405), rgba(0, 128, 0, 0.407), rgba(0, 100, 0, 0.291));
                text-align: center;
                padding: 2rem;
                border-radius: 0.5rem;
                color: white;
                font-weight: bolder;
                
                .summary{
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    border-radius: 0.5rem;
                    margin-top: 2rem;
                    gap:1rem;
                    
                    .income-summary{
                        background-color: white;
                        padding:2rem;
                        color: green;
                        font-weight: bolder;
                        border-radius: 0.5rem;
                    }
                    .expense-summary{
                        background-color: white;
                        padding: 2rem;
                        color: red;
                        font-weight: bolder;
                        border-radius: 0.5rem;
                    }
                }
            }
        }
        .transaction-container{
            background-color: brown;
            display: grid;
            grid-template-columns: 1fr 1fr;
            .form-group{
                display: flex;
                flex-direction: column;
            }
             
        }
    </style>
</head>
<body>
    <div class="main-container">
        <p>Expense Tracker</p>
        <div class="view-container">
            
            <p>Your Balance</p>
            <p>$1</p>
            <!-- Placeholder for calculated balance -->

            <div class="summary">
                <div class="income-summary">
                    <p>Income</p>
                    <p>$6</p>
                </div>
                <div class="expense-summary">
                    <p>Expenses</p>
                    <p>-$5</p>
                </div>
            </div>

        </div>

        <div class="transaction-container">
            <div class="transactions">
                <p>Transactions</p>
                <!-- List of Transactions go here -->
            </div>
            <div class="add-transactions">
                <!-- Form goes here -->
                 <form>
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" placeholder="Enter the description">
                    </div>
                    <div class="form-group">
                        <label>Amount</label>
                        <input type="number" placeholder="Enter the amount">
                    </div>
                    <button>Add Transaction</button>
                 </form>
            </div>
        </div>

    </div>

</body>
</html>
