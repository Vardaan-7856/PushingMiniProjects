<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Palette</title>
    <style>

        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body{
            display: flex;
            flex-shrink: 0;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color:rgb(19, 1, 61);
        }
        
        .container{
            background-color: rgba(255, 255, 255, 0.777); 
            width: 600px;   
            height: 400px;
            border-radius: 1rem;
            padding: 1rem;
            box-shadow: 0px 0px 5rem rgb(100, 1, 100);
            color: white;
            text-align: center;
        }
        .titleName{
            position: relative;
            text-shadow: 1px 2px 0px black;
        }
        .titleName::after{
            position: absolute;
            bottom:0px;
            left:0px;
            content: "";
            background-color: white;
            width: 100%;
            height: 1px;
            display: block;
        }
        .genButton{
            margin:1rem;
            cursor:pointer;
        }
        .color-box{
            padding: 1rem;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            grid-column-gap: 0.5rem; 
            width: 100%;
            height: 50%;
            
        }
        .color-box button{
            border-radius: 0.5rem;
            border-style: none;
            
            transition-property: background-color;
            transition-duration: 2s;
            transition-timing-function: ease-in-out;
        }
        .colorBrick{
            background-color: white;
            cursor:pointer;
            
        }
        .colorBrick:hover{
            border-style: solid;
            border-width: 2px;
            border-color: black;
        }
        .colorBrick:active{
            margin-top: 1rem;
        }
        </style>
</head>
<body>
    <div class="container">
        <h1 class="titleName">Color Palette Generator</h1>
        <button id="genButton" class="genButton">
            Generate Palette
        </button>
        <div class="color-box" id="colorBox">
            <button id="color1" class="colorBrick"></button>
            <button id="color2" class="colorBrick"></button>
            <button id="color3" class="colorBrick"></button>
            <button id="color4" class="colorBrick"></button>
            <button id="color5" class="colorBrick"></button>
        </div>
    </div>
    <script>
        const genButton = document.getElementById("genButton");
        const colorBox = document.getElementById("colorBox");
        const colorBrick = document.getElementsByClassName("colorBrick")

        const colorData = "123456789ABCDEF";
        let color = "#";
        let randomIndex = 0;
        let colorArray = [];
        // Events
        genButton.addEventListener("click", (e) => {
            //Clear the working area aka color-box
            // colorBox.innerHTML = button
            e.preventDefault();

            //Fix: Persistent colors
                colorArray.length = 0;

            
            //put the generated hex pattern in the array
            for(let j = 0; j < 5; j++)
            {
                for(let i = 0; i < 6; i++)
                {
                    //generates a hex pattern
                    randomIndex = Math.floor(Math.random() * colorData.length);
                    color += colorData[randomIndex];
                }
                
                colorArray.push(color);
                color = "#";
                
            }
            console.log(colorArray);

            //Update the background colors using data from Array
            colorArray.forEach((currentColor, index) => {
                console.log(currentColor);

                let anchorID = "color" + (index+1);
                let anchor = document.getElementById(anchorID);

                anchor.style.backgroundColor = currentColor;
                anchor.textContent = currentColor;
            });
        });

        colorBox.addEventListener("click", (e) => {
            e.preventDefault();

            //stores the button ID of the button clicked
            let buttonID = event.target.id;
            let buttonColor = event.target.textContent; 
            
            navigator.clipboard.writeText(buttonColor)
            .then(() => {
                console.log("Copied:", buttonColor);
                //change textContent of button to copied
                console.log("Button ID is: ", buttonID);
                
                document.getElementById(buttonID).textContent = "Copied!";
                setTimeout(() => {
                    document.getElementById(buttonID).textContent = buttonColor;
                }, 1000);
                                
            })
            .catch((err) => {
                console.error("Copy failed:", err);
            });
        });
        


    </script>
</body>
</html>
